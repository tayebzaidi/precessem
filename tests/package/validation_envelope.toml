# WF-14: public name -> gate test nodes. Node IDs only — no band, record or
# tolerance is restated here (§7 WF-14 Done-when). Surface = fem_em_solver.__all__.
#
# Node IDs are relative to /workspace (pytest rootdir), function-level. A node
# named without a "[...]" suffix matches any collected parametrisation of it.
# Only collectability is asserted (tests/package/test_wf14_validation_envelope.py),
# not that a node is green today.
#
# Not in v0's surface: the sub-package __all__ lists (core, io, materials,
# ports, post, thermal; coils and utils declare none). Widening the surface
# to their qualified union is a review decision, not this registry's.

